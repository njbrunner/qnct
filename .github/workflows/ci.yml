name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for Gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: |
          ./gradlew assembleDebug --stacktrace --info > build.log 2>&1 || {
            echo "=== Kotlin compiler errors ==="
            grep -iE "^e:|error:|unresolved|cannot find|cannot access|type mismatch|expecting|incompatible" build.log | head -n 80 || true
            echo "=== Failure summary ==="
            tail -n 80 build.log
            exit 1
          }

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build.log

  test:
    name: test
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for Gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        run: |
          ./gradlew testDebugUnitTest --stacktrace > test.log 2>&1 || {
            echo "=== Test failures ==="
            find app/build/test-results -name "*.xml" -exec cat {} \; || true
            echo "=== Failure summary ==="
            tail -n 80 test.log
            exit 1
          }

  lint:
    name: lint
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for Gradlew
        run: chmod +x gradlew

      - name: Run Android Lint
        run: ./gradlew lintDebug
